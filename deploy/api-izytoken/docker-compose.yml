services:
  new-api:
    profiles: [rollback]
    image: new-api:rc20
    container_name: new-api-migrated
    mem_limit: 16g
    memswap_limit: 16g
    restart: always
    ports:
    - 3001:3000
    volumes:
    - ./data:/data
    environment:
    - DISABLE_MEMORY_CACHE=true
    - TIKTOKEN_CACHE_DIR=/tmp
    - CPU_THRESHOLD=100
    - STREAMING_TIMEOUT=300
    - RELAY_TIMEOUT=300
    - RETRY_TIMES=3
    - RETRY_COOLDOWN_SECONDS=0
    - CHANNEL_DISABLE_THRESHOLD=5
    - DISABLE_CHANNEL_BY_AUTO=false
    - ENABLE_DATA_EXPORT=false
    - GENERATE_DEFAULT_TOKEN=true
    - ERROR_LOG_ENABLED=true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
    - new-api-net
  caddy:
    image: caddy:2-alpine
    container_name: new-api-caddy
    restart: always
    ports:
    - 80:80
    - 443:443
    - 443:443/udp
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - ./caddy_data:/data
    - ./caddy_config:/config
    - ./override:/override:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
    - new-api-pg
    networks:
    - new-api-net
  postgres:
    image: postgres:15-alpine
    container_name: new-api-migrated-postgres
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped
    environment:
    - POSTGRES_USER=root
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=new-api
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - new-api-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: new-api-migrated-redis
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
    - redis_data:/data
    networks:
    - new-api-net
  new-api-pg:
    image: new-api:rc20
    container_name: new-api-migrated-pg
    mem_limit: 4g
    memswap_limit: 4g
    restart: unless-stopped
    expose:
    - "3000"
    volumes:
    - ./data:/data
    environment:
    - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD}@postgres:5432/new-api
    - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379/0
    - DISABLE_MEMORY_CACHE=true
    - TIKTOKEN_CACHE_DIR=/tmp
    - CPU_THRESHOLD=100
    - STREAMING_TIMEOUT=300
    - RELAY_TIMEOUT=300
    - RETRY_TIMES=3
    - RETRY_COOLDOWN_SECONDS=0
    - CHANNEL_DISABLE_THRESHOLD=5
    - DISABLE_CHANNEL_BY_AUTO=false
    - ENABLE_DATA_EXPORT=false
    - GENERATE_DEFAULT_TOKEN=true
    - ERROR_LOG_ENABLED=true
    depends_on:
    - postgres
    - redis
    networks:
    - new-api-net
volumes:
  postgres_data:
  redis_data:
networks:
  new-api-net:
    driver: bridge
